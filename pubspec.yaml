name: grox
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  dotted_border: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true

  assets:
    - assets/pngs/
    - assets/fonts/

  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist/static/Geist-Thin.ttf
          weight: 100
        - asset: assets/fonts/Geist/static/Geist-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Geist/static/Geist-Light.ttf
          weight: 300
        - asset: assets/fonts/Geist/static/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist/static/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist/static/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist/static/Geist-Bold.ttf
          weight: 700
        - asset: assets/fonts/Geist/static/Geist-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Geist/static/Geist-Black.ttf
          weight: 900